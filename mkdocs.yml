site_name: ECLIPSE
site_description: Emission Calculation and Line Prediction for SOLAR-C EUVST
repo_url: https://github.com/jamesmckevitt/eclipse
repo_name: jamesmckevitt/eclipse

theme:
  name: material
  custom_dir: overrides
  logo: images/logo/favicon-transparent.svg
  favicon: images/logo/favicon-transparent.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Worked example: worked-example.ipynb
  - Using ECLIPSE:
      - Run files: run-files.md
      - On a cluster: cluster.md
      - From Python: python.md
  - 1. Make the emission:
      - From another code: emission/other-codes.md
      - From a single intensity: emission/single-intensity.md
      - From an MHD simulation: emission/mhd.md
      - From a DEM or VDEM: emission/dem.md
  - 2. Observe it:
      - Simulating an observation: observe/simulate.md
      - Rasters and sit-and-stares: observe/rasters.md
      - Fitting the lines: observe/fitting.md
      - Full-CCD frames: observe/full-ccd-frames.md
  - 3. Analyse your measurements:
      - Analysing an observation: analyse/observation.md
      - Analysing a full-CCD frame: analyse/frame.md
  - Files:
      - Atmosphere files: files/atmosphere.md
      - Emission measure files: files/emission-measure.md
      - Synthesis files: files/synthesis.md
      - Results files: files/results.md
      - Frame files: files/frame.md
  - Background:
      - The instrument model: background/instrument-model.md
      - Instrument sources: background/instrument-sources.md
  - Reference:
      - Run file settings: reference/run-file-settings.md
      - Commands: reference/commands.md
      - Naming spectral lines: reference/line-names.md
      - API reference: api.md
      - Older versions: reference/older-versions.md
  - Acknowledgements: acknowledgements.md

# docs/internal/ holds pages for the instrument team, reached only by a link.
# They stay out of the nav, and out of the site search, Read the Docs' search
# and search engines through their front matter, .readthedocs.yaml and
# overrides/main.html.
not_in_nav: |
  /internal/

# The notes beside the logo files are for the repository, not the site.
exclude_docs: |
  /images/logo/README.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/guide3.js
  - javascripts/route.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc

plugins:
  - search
  # Notebooks only. Otherwise the plugin reads every Markdown page to see
  # whether it is a notebook, through pandoc where pandoc is installed, as it
  # is on Read the Docs, and pandoc stalls on the API page's ::: lines. Only
  # the ignore list is checked before a page is read.
  - mkdocs-jupyter:
      ignore: ["*.md"]
      include_source: true
  # Pages that were moved or merged into others, so that links to them still
  # land.
  - redirects:
      redirect_maps:
        vdem-synthesis.md: emission/dem.md#with-velocities-a-vdem
        instruments.md: background/instrument-model.md#the-instruments
        quickstart.md: run-files.md#installing
        synthesis.md: emission/mhd.md
        dem-synthesis.md: emission/dem.md
        other-codes.md: emission/other-codes.md
        uniform-intensity.md: emission/single-intensity.md
        instrument-response.md: observe/simulate.md
        fitting.md: observe/fitting.md
        time-series.md: observe/rasters.md
        full-ccd-frame.md: observe/full-ccd-frames.md
        analysis.md: analyse/observation.md
        instrument-model.md: background/instrument-model.md
        instrument-sources.md: background/instrument-sources.md
        configuration.md: reference/run-file-settings.md
        files.md: files/synthesis.md
        line-names.md: reference/line-names.md
        older-versions.md: reference/older-versions.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            heading_level: 3
            filters: ["!^_"]
