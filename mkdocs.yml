site_name: ECLIPSE
site_description: Emission Calculation and Line Prediction for SOLAR-C EUVST
repo_url: https://github.com/jamesmckevitt/eclipse
repo_name: jamesmckevitt/eclipse

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting started: quickstart.md
  - Worked example: worked-example.ipynb
  - 1. Synthesising the spectra:
      - From an MHD simulation: synthesis.md
      - From a DEM or VDEM: dem-synthesis.md
      - Spectra from another code: other-codes.md
  - 2. Simulating the instrument:
      - Running a simulation: instrument-response.md
      - Configuration reference: configuration.md
      - Fitting blended lines: fitting.md
      - A single line of known intensity: uniform-intensity.md
      - Time series: time-series.md
      - Instruments: instruments.md
  - 3. Analysing the results: analysis.md
  - Python:
      - Using ECLIPSE from Python: python.md
      - API reference: api.md
  - Reference:
      - Files: files.md
      - Naming spectral lines: line-names.md
      - Older versions: older-versions.md
  - Acknowledgements: acknowledgements.md

# docs/internal/ holds pages for the instrument team, reached only by a link.
# They stay out of the nav, and out of the site search, Read the Docs' search
# and search engines through their front matter, .readthedocs.yaml and
# overrides/main.html.
not_in_nav: |
  /internal/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
  # Pages that were merged into others, so that links to them still land.
  - redirects:
      redirect_maps:
        vdem-synthesis.md: dem-synthesis.md#with-velocities-a-vdem
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            heading_level: 3
            filters: ["!^_"]
