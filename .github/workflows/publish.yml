name: Publish to PyPI

# Publishing a GitHub release is what triggers this, so the release procedure in
# CONTRIBUTING.md stops at "push the tag and write the notes".
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the build tools
        run: python -m pip install --upgrade build twine

      - name: Build the sdist and wheel
        run: python -m build

      # A PyPI version cannot be replaced once it is uploaded, so everything
      # that can be checked is checked before the publish job runs.
      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import euvst_response; print(euvst_response.__version__)")
          echo "tag=${tag} package=${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${pkg}"
            exit 1
          fi

      - name: Check the package data is in the wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          data = [n for n in names if "/data/" in n]
          if not data:
              raise SystemExit(
                  f"no euvst_response/data files in {wheel}; the package would "
                  "install but fail at runtime"
              )
          print(f"{len(data)} data files in the wheel")
          PY

      - name: Check the metadata renders
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Kept separate from the build so that id-token write is the only elevated
    # permission granted, and only after every check above has passed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing: PyPI verifies the workflow's OIDC identity, so there
      # is no API token to store or rotate.
      - uses: pypa/gh-action-pypi-publish@release/v1
