name: Publish to PyPI

# Publishing a GitHub release is what triggers this, so the release procedure in
# CONTRIBUTING.md stops at "push the tag and write the notes".
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the build tools
        run: python -m pip install --upgrade build twine

      - name: Build the sdist and wheel
        run: python -m build

      # solarc-eclipse, the former name on PyPI, is an sdist whose install stops
      # and says to install eclipse. It has a fixed version, so it is built and
      # uploaded only by the first release after it changes.
      - name: Build solarc-eclipse if PyPI does not have this version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('legacy/solarc-eclipse/pyproject.toml', 'rb'))['project']['version'])")
          status=$(curl --silent --retry 3 --max-time 30 --output /dev/null --write-out "%{http_code}" "https://pypi.org/pypi/solarc-eclipse/$version/json" || true)
          case "$status" in
            200) echo "solarc-eclipse $version is already on PyPI" ;;
            404) SOLARC_ECLIPSE_BUILD=1 python -m build --sdist --outdir dist legacy/solarc-eclipse ;;
            *) echo "::error::PyPI answered $status for solarc-eclipse $version"; exit 1 ;;
          esac

      # A PyPI version cannot be replaced once it is uploaded, so everything
      # that can be checked is checked before the publish job runs.
      - name: Check the packages, their version and the package files
        run: python tools/check_packages.py --tag "$GITHUB_REF_NAME"

      - name: Check the metadata renders
        run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Kept separate from the build so that id-token write is the only elevated
    # permission granted, and only after every check above has passed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      # Trusted publishing: PyPI verifies the workflow's OIDC identity, so there
      # is no API token to store or rotate.  Pinned to a commit SHA rather than a
      # moving tag, because this step can publish and a retagged upstream would
      # otherwise change what runs here without review.  Dependabot keeps the
      # pins current.  Files already on PyPI are skipped, so that rerunning the job
      # after a partly failed upload uploads the rest.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
