name: Publish to PyPI

# Publishing a GitHub release is what triggers this, so the release procedure in
# CONTRIBUTING.md stops at "push the tag and write the notes".
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the build tools
        run: python -m pip install --upgrade build twine

      - name: Build the sdist and wheel
        run: python -m build

      # solarc-eclipse, the former name on PyPI, gets a release only when its
      # own version is the one being tagged.
      - name: Build solarc-eclipse if this release is its version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('legacy/solarc-eclipse/pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" = "$GITHUB_REF_NAME" ]; then
            python -m build --outdir dist legacy/solarc-eclipse
          else
            echo "solarc-eclipse is at $version, so it is not released with $GITHUB_REF_NAME"
          fi

      # A PyPI version cannot be replaced once it is uploaded, so everything
      # that can be checked is checked before the publish job runs.
      - name: Check the tag matches the packaged version
        run: |
          python - <<'PY'
          import glob
          import os
          import zipfile

          # Read the version out of the wheel rather than by importing the
          # package, which would need every runtime dependency installed.  This
          # also checks the artefact that is actually about to be uploaded.
          wheel = glob.glob("dist/eclipse-*.whl")[0]
          archive = zipfile.ZipFile(wheel)
          metadata = next(
              name for name in archive.namelist()
              if name.endswith(".dist-info/METADATA")
          )
          version = next(
              line.split(": ", 1)[1].strip()
              for line in archive.read(metadata).decode().splitlines()
              if line.startswith("Version: ")
          )

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          print(f"tag={tag} packaged={version}")
          if tag != version:
              raise SystemExit(
                  f"::error::tag {tag} does not match the packaged version {version}"
              )
          PY

      - name: Check the package files are in the wheel
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import zipfile

          # Compare against the source tree rather than a hardcoded list, so
          # this keeps working when files are added, and so partial
          # inclusion fails rather than passing on the strength of one file.
          source = pathlib.Path("src")
          data = {path for path in (source / "eclipse/data").rglob("*") if path.is_file()}
          if not data:
              raise SystemExit("no src/eclipse/data files in the checkout")
          modules = set((source / "eclipse").rglob("*.py"))
          modules |= set((source / "euvst_response").rglob("*.py"))
          if source / "euvst_response/__init__.py" not in modules:
              raise SystemExit("no src/euvst_response/__init__.py in the checkout")
          expected = {path.relative_to(source).as_posix() for path in data | modules}

          wheel = glob.glob("dist/eclipse-*.whl")[0]
          packaged = set(zipfile.ZipFile(wheel).namelist())

          missing = sorted(expected - packaged)
          if missing:
              raise SystemExit(
                  f"::error::{len(missing)} of {len(expected)} package files are "
                  f"absent from {wheel}, so the package would install but fail "
                  f"at runtime: {', '.join(missing)}"
              )
          print(f"all {len(expected)} package files are in the wheel")
          PY

      - name: Check solarc-eclipse holds the former package name
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import zipfile

          wheels = glob.glob("dist/solarc_eclipse-*.whl")
          if wheels:
              packaged = zipfile.ZipFile(wheels[0]).read("euvst_response/__init__.py")
              if packaged != pathlib.Path("src/euvst_response/__init__.py").read_bytes():
                  raise SystemExit(f"::error::{wheels[0]} holds a different euvst_response")
              print(f"{wheels[0]} holds euvst_response")
          PY

      - name: Check the metadata renders
        run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Kept separate from the build so that id-token write is the only elevated
    # permission granted, and only after every check above has passed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      # Trusted publishing: PyPI verifies the workflow's OIDC identity, so there
      # is no API token to store or rotate.  Pinned to a commit SHA rather than a
      # moving tag, because this step can publish and a retagged upstream would
      # otherwise change what runs here without review.  Dependabot keeps the
      # pins current.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
