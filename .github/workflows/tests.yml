name: Tests

on:
  push:
    branches: [master]
  pull_request:

# A push to a branch with an open pull request triggers this twice, and only the
# newest commit matters, so supersede the earlier run rather than paying for it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # One version failing is worth knowing about even when the other already
      # has, since the usual cause is a dependency that dropped a version.
      fail-fast: false
      matrix:
        # The versions pyproject.toml claims support for. Adding a classifier
        # without adding it here would leave the claim untested.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      # Pinned to commit SHAs to match publish.yml, so that Dependabot's grouped
      # bump moves every workflow together and a retagged upstream cannot change
      # what runs here without review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra rather than pytest alone, because that is the install a
      # contributor is told to make and this is where it gets exercised. sunpy
      # and fiasco pull in a lot, which is what the pip cache above is for.
      - name: Install the package and its test dependencies
        run: python -m pip install --editable ".[dev]"

      # An editable install puts the package on the path, so this runs against
      # the tree as checked out rather than a copy, and the data files under
      # euvst_response/data resolve the way they do for a developer.
      - name: Run the tests
        run: python -m pytest tests/ -v

  # The tests that check ECLIPSE against CHIANTI itself need fiasco's database,
  # which the job above does not build, so they are skipped there. Here it is
  # built, once per fiasco version, and kept in the cache; building it downloads
  # the CHIANTI release, some 600 MB, and takes about ten minutes, so a cache hit
  # is the usual case.
  chianti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        run: python -m pip install --editable ".[dev]"

      # fiasco reads a database built by its own version, for the CHIANTI
      # release that version supports.
      - name: Name the database for this fiasco
        id: database
        run: python -c "import fiasco; print(f'key=chianti-fiasco-{fiasco.__version__}-checked')" >> "$GITHUB_OUTPUT"

      - name: Restore the database
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.fiasco/chianti_dbase.h5
          key: ${{ steps.database.outputs.key }}

      # Downloaded over HTTPS, which the CHIANTI server gives though fiasco asks
      # for HTTP, and each file checked against the hashes fiasco keeps for the
      # release before it goes into the database.
      - name: Build the database
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import fiasco
          from fiasco.util import check_database
          from fiasco.util.setup_db import _get_chianti_dbase_url

          url = _get_chianti_dbase_url()
          if not url.startswith(("http://", "https://")):
              raise SystemExit(f"Unexpected CHIANTI database URL: {url}")
          url = "https://" + url.split("://", 1)[1]
          check_database(fiasco.defaults["hdf5_dbase_root"], ask_before=False,
                         ascii_dbase_url=url, check_hash=True)
          PY
          rm -rf ~/.fiasco/chianti_dbase ~/.fiasco/tmp

      # With ECLIPSE_REQUIRE_CHIANTI set, a missing database stops the run
      # rather than skipping these tests.
      - name: Run the tests that need it
        env:
          ECLIPSE_REQUIRE_CHIANTI: "1"
        run: python -m pytest tests/ -m chianti -v
