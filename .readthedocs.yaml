version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# The defaults, and the instrument team's pages, which are reached by link only.
search:
  ignore:
    - search.html
    - search/index.html
    - 404.html
    - 404/index.html
    - internal/*
