[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarc-eclipse"
dynamic = ["version"]
authors = [
    {name = "James McKevitt", email = "jm2@mssl.ucl.ac.uk"},
]
description = "ECLIPSE: Emission Calculation and Line Prediction for SOLAR-C EUVST"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.0",
    "astropy>=6.1.5",
    "ndcube>=2.3",
    "specutils>=2.0",
    "scipy",
    "matplotlib>=3.8.4",
    "joblib>=1.2",
    "tqdm",
    "dill",
    "pyyaml",
    "reproject>=0.14",
    "sunpy[all]>=6.0",
    "dask>=2024.9.1",
    "psutil",
    "mendeleev",
    "h5py>=3.11",
    "fiasco>=0.5",
]

[project.optional-dependencies]
mpi = [
    "mpi4py",
]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
    # Needed when re-running the tutorial notebook, not when building the docs
    # (mkdocs-jupyter renders the stored outputs without executing anything).
    # Without it tqdm emits a TqdmWarning, which gets saved into the notebook
    # outputs and then shows up as an error block on the docs site.
    "ipywidgets",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]

[project.scripts]
eclipse = "euvst_response.cli:main"
solarc-eclipse = "euvst_response.cli:main"
synthesise-spectra = "euvst_response.synthesis_cli:main"
synthesise_spectra = "euvst_response.synthesis_cli:main"
eclipse-science-cases = "euvst_response.science_cases:main"
eclipse-atmosphere = "euvst_response.atmosphere:main"

[project.urls]
Homepage = "https://github.com/jamesmckevitt/eclipse"
Repository = "https://github.com/jamesmckevitt/eclipse"
Documentation = "https://solarc-eclipse.readthedocs.io"

[tool.setuptools.packages.find]
include = ["euvst_response*"]

[tool.setuptools.dynamic]
version = {attr = "euvst_response.__version__"}

[tool.setuptools.package-data]
euvst_response = ["data/**/*"]
