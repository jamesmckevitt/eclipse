# Science cases from the Concept Study Report (CSR), with every line in each.
# From the NRL observation files, version 01. Lines commented out there are
# left out.
#
# Line intensities are before the filling factor. slit_width is the raster
# step (step_dx) and exposure the exposure time (exp_time). raster_steps
# (step_x), bin_x, bin_y, slit_length (slit_ny_arcsec), duration, sji_cadence
# and sji_waves describe the observing programme and are not used by ECLIPSE.
#
# eclipse-science-cases writes ECLIPSE configurations from this file.

- task: I-1-1
  name: 1.1.1-nanoflares_events
  description: Observe small scale heating events
  target: active region
  observables: [intensity]
  source: VR78 AR + WWB12
  filling_factor: 4
  slit_width: 0.4 arcsec
  exposure: 5 s
  raster_steps: 1
  bin_x: 2
  bin_y: 1
  slit_length: 140 arcsec
  duration: 1 h
  sji_cadence: 5 s
  sji_waves: 1
  lines:
    - {ion: Ne VIII, wavelength: 770.428 AA, log_t_max: 5.80, intensity: 600 erg / (s cm2 sr)}
    - {ion: Fe IX, wavelength: 171.073 AA, log_t_max: 5.85, intensity: 1044 erg / (s cm2 sr)}
    - {ion: Fe XII, wavelength: 195.119 AA, log_t_max: 6.20, intensity: 939 erg / (s cm2 sr)}
    - {ion: Fe XIV, wavelength: 211.317 AA, log_t_max: 6.30, intensity: 1410 erg / (s cm2 sr)}
    - {ion: Si XII, wavelength: 499.41 AA, log_t_max: 6.30, intensity: 2473 erg / (s cm2 sr)}
    - {ion: Ca XIV, wavelength: 193.874 AA, log_t_max: 6.55, intensity: 281 erg / (s cm2 sr)}
    - {ion: Fe XVIII, wavelength: 974.860 AA, log_t_max: 6.85, intensity: 79 erg / (s cm2 sr)}
    - {ion: Fe XIX, wavelength: 1118.076 AA, log_t_max: 6.95, intensity: 6 erg / (s cm2 sr)}

