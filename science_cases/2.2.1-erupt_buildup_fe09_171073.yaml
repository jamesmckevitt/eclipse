# Science case II-2-1 (2.2.1-erupt_buildup): Energy buildup
# Target: active region. Observables: intensity, velocity, width. Source: AR
# Line: Fe IX 171.073 Angstrom, log T_max = 5.85
# Intensity: 8400 erg/(s cm2 sr) times filling factor 4
# Thermal width: sqrt(k T / m) at T = T_max

instrument: SWC
n_iter: 512
ncpu: -1
offchip_bin_slit: [1, 2]

uniform_intensity: 33600 erg / (s cm2 sr)
rest_wavelength: 171.073 AA
thermal_width: 10.27 km/s

simulation:
  expos: 0.5 s
  slit_width: 1.6 arcsec
  psf: True
