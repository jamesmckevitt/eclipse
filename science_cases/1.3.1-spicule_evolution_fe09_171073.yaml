# Science case I-3-1 (1.3.1-spicule_evolution): Observe spicule heating
# Target: active region plage. Observables: intensity. Source: S2017
# Line: Fe IX 171.073 Angstrom, log T_max = 5.85
# Intensity: 8000 erg/(s cm2 sr) times filling factor 1
# Thermal width: sqrt(k T / m) at T = T_max

instrument: SWC
n_iter: 512
ncpu: -1
offchip_bin_slit: [1, 2]

uniform_intensity: 8000 erg / (s cm2 sr)
rest_wavelength: 171.073 AA
thermal_width: 10.27 km/s

simulation:
  expos: 2 s
  slit_width: 0.4 arcsec
  psf: True
