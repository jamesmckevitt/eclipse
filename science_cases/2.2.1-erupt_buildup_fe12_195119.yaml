# Science case II-2-1 (2.2.1-erupt_buildup): Energy buildup
# Target: active region. Observables: intensity, velocity, width. Source: AR
# Line: Fe XII 195.119 Angstrom, log T_max = 6.20
# Intensity: 3890 erg/(s cm2 sr) times filling factor 4
# Thermal width: sqrt(k T / m) at T = T_max

instrument: SWC
n_iter: 512
ncpu: -1
offchip_bin_slit: [1, 2]

uniform_intensity: 15560 erg / (s cm2 sr)
rest_wavelength: 195.119 AA
thermal_width: 15.36 km/s

simulation:
  expos: 0.5 s
  slit_width: 1.6 arcsec
  psf: True
