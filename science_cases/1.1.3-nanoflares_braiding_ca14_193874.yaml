# Science case I-1-3 (1.1.3-nanoflares_braiding): Search for evidence of braiding
# Target: active region. Observables: intensity, velocity, width. Source: VR78 AR + WWB12
# Line: Ca XIV 193.874 Angstrom, log T_max = 6.55
# Intensity: 281 erg/(s cm2 sr) times filling factor 4
# Thermal width: sqrt(k T / m) at T = T_max

instrument: SWC
n_iter: 512
ncpu: -1
offchip_bin_slit: [1, 2]

uniform_intensity: 1124 erg / (s cm2 sr)
rest_wavelength: 193.874 AA
thermal_width: 27.13 km/s

simulation:
  expos: 5 s
  slit_width: 0.4 arcsec
  psf: True
