# Science case I-4-1 (1.4.1-sw_source_regions): Observe solar wind source regions
# Target: active region outflows. Observables: intensity, velocity, width, temperature, density. Source: j-proposal
# Line: Fe XII 195.119 Angstrom, log T_max = 6.20
# Intensity: 3890 erg/(s cm2 sr) times filling factor 0.2
# Thermal width: sqrt(k T / m) at T = T_max

instrument: SWC
n_iter: 512
ncpu: -1
offchip_bin_slit: [1, 2]

uniform_intensity: 778 erg / (s cm2 sr)
rest_wavelength: 195.119 AA
thermal_width: 15.36 km/s

simulation:
  expos: 6 s
  slit_width: 0.8 arcsec
  psf: True
